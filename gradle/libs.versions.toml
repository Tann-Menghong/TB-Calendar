[versions]
androidGradlePlugin = "9.0.1"
kotlin = "2.3.20"
ksp = "2.3.11"
coroutines = "1.10.2"
serialization = "1.9.0"

androidxCore = "1.18.0"
androidxActivity = "1.13.0"
androidxLifecycle = "2.10.0"
androidxComposeBom = "2026.03.01"
navigationCompose = "2.8.0"
materialIconsExtended = "1.7.0"

room = "2.8.4"
datastore = "1.2.1"
work = "2.11.2"
glance = "1.2.0"
biometric = "1.1.0"
fragment = "1.8.6"
splashscreen = "1.0.1"

mediapipeTasksGenai = "0.10.35"
okhttp = "4.12.0"

junit = "4.13.2"
androidxTest = "1.7.0"
androidxTestExt = "1.3.0"
androidxTestEspresso = "3.7.0"
robolectric = "4.14.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material3-window = { module = "androidx.compose.material3:material3-window-size-class" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
